        // ==========================================

        const StorageService = {
            generateSeedHistory() {
                const history = [];
                const baseDate = new Date();
                let sessionId = 1;
                
                for (let dateIdx = 0; dateIdx < 10; dateIdx++) {
                    const sessionDate = new Date(baseDate);
                    sessionDate.setDate(sessionDate.getDate() - dateIdx);
                    // Skip weekends
                    if(sessionDate.getDay() === 0 || sessionDate.getDay() === 6) continue;
                    
                    const dateStr = sessionDate.toISOString().split('T')[0];
                    
                    // Generate 2 periods per day
                    for(let p = 0; p < 2; p++) {
                        const periodId = (dateIdx % 7) + 1;
                        
                        const records = {};
                        INITIAL_STUDENTS.forEach((student, studentIdx) => {
                            const seedVal = (studentIdx * 17 + dateIdx * 13 + periodId * 7) % 100;
                            let status = 'P';
                            if (seedVal > 92) status = 'A';
                            else if (seedVal > 84) status = 'OD';
                            records[student.id] = status;
                        });
                        
                        history.push({
                            id: `session-${sessionId++}`,
                            date: dateStr,
                            periodId: periodId,
                            academicYear: ACADEMIC_YEARS[0],
                            semester: SEMESTERS[4],
                            records: records,
                            timestamp: new Date().getTime()
                        });
                    }
                }
                return history;
            },

            init() {
                // Clear old history if subjectId exists or has old "L" status
                const oldHistory = localStorage.getItem('paavai_history');
                if (oldHistory && (oldHistory.includes('subjectId') || oldHistory.includes('"L"'))) {
                    localStorage.removeItem('paavai_history');

                if (!localStorage.getItem('paavai_history')) {
                    localStorage.setItem('paavai_history', JSON.stringify(this.generateSeedHistory()));

                    }
                    if (!users.some(u => u.email === 'faculty@paavai.edu.in')) {

                    localStorage.setItem('paavai_staff_users', JSON.stringify(users));
                }
                if (!localStorage.getItem('paavai_staff_passcode')) {
                    localStorage.setItem('paavai_staff_passcode', 'paavaistaff');
                }
            },

            getStudents() {
                const students = JSON.parse(localStorage.getItem('paavai_students') || '[]');
                const history = this.getHistory();
                
                return students.map(student => {
                    let total = 0, present = 0, od = 0, absent = 0;
                    history.forEach(session => {
                        if (session.records[student.id]) {
                            total++;
                            if (session.records[student.id] === 'P') present++;
                            if (session.records[student.id] === 'OD') od++;
                            if (session.records[student.id] === 'A') absent++;
                        }
                    });
                    const percent = total > 0 ? Math.round(((present + od) / total) * 100) : 100;
                    let health = 'healthy';
                    if (percent < 60) health = 'critical';
                    else if (percent < 75) health = 'warning';
                    
                    return { ...student, stats: { total, present, od, absent, percent, health } };
                });
            },

            saveHistorySession(sessionData) {
                let history = this.getHistory();
                if (sessionData.id) {
                    history = history.map(h => h.id === sessionData.id ? { ...h, ...sessionData, timestamp: new Date().getTime() } : h);
                } else {
                    history.push({
                        ...sessionData,
                        id: 'session-' + new Date().getTime(),
                        timestamp: new Date().getTime()
                    });
                }
                localStorage.setItem('paavai_history', JSON.stringify(history));
                this.clearDraft();
            },

                const history = this.getHistory();

        // ==========================================

        const ExportService = {
            exportPDF(session, students) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.text("PAAVAI ENGINEERING COLLEGE", 105, 15, { align: "center" });
                doc.setFontSize(12);
                doc.text("DEPARTMENT OF CSE - B", 105, 22, { align: "center" });
                
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                const period = PERIODS.find(p => p.id == session.periodId);
                
                doc.text(`Date: ${session.date}`, 14, 35);
                doc.text(`Period: ${period ? period.name + ' (' + period.time + ')' : 'N/A'}`, 14, 41);
                doc.text(`Academic Year: ${session.academicYear}`, 130, 35);
                doc.text(`Semester: ${session.semester}`, 130, 41);
                
                const tableData = students.map(s => {
                    const status = session.records[s.id] || '-';
                    const statusText = status === 'P' ? 'Present' : status === 'OD' ? 'On Duty' : status === 'A' ? 'Absent' : 'Unmarked';
                    return [s.sno, s.regNo, s.name, statusText];
                });
                
                doc.autoTable({
                    startY: 48,
                    head: [['S.No', 'Reg. No', 'Student Name', 'Status']],
                    body: tableData,
                    theme: 'grid',
                    headStyles: { fillColor: [49, 46, 129] },
                    didParseCell: function(data) {
                        if (data.section === 'body' && data.column.index === 3) {
                            if (data.cell.raw === 'Present') data.cell.styles.textColor = [21, 128, 61];
                            if (data.cell.raw === 'On Duty') data.cell.styles.textColor = [2, 132, 199];
                            if (data.cell.raw === 'Absent') data.cell.styles.textColor = [185, 28, 28];
                        }
                    }
                });
                
                let present = 0, od = 0, absent = 0;
                Object.values(session.records).forEach(v => {
                    if(v==='P') present++;
                    if(v==='OD') od++;
                    if(v==='A') absent++;
                });
                const total = present + od + absent;
                const perc = total > 0 ? Math.round(((present+od)/total)*100) : 0;
                
                const finalY = doc.lastAutoTable.finalY + 10;
                doc.setFont("helvetica", "bold");
                doc.text(`Summary:`, 14, finalY);
                doc.setFont("helvetica", "normal");
                doc.text(`Total: ${total} | Present: ${present} | OD: ${od} | Absent: ${absent} | Attendance: ${perc}%`, 14, finalY + 6);
                
                doc.text("Faculty Signature", 14, finalY + 30);
                doc.text("HOD", 105, finalY + 30, { align: "center" });
                doc.text("Principal", 196, finalY + 30, { align: "right" });
                
                doc.save(`Attendance_${session.date}_Period_${session.periodId}.pdf`);
            },
            
            exportExcel(session, students) {

                const ws = window.XLSX.utils.aoa_to_sheet(wsData);

        const { useState, useEffect, useMemo, useCallback } = React;

        // 1. Toast
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                if (message) {
                    const timer = setTimeout(onClose, 4000);
                    return () => clearTimeout(timer);
                }
            }, [message, onClose]);

            if (!message) return null;
            
            const colors = {
                success: "bg-emerald-500",
                info: "bg-indigo-500",
                warning: "bg-amber-500",
                error: "bg-rose-500"
            };
            
            return (
                <div className={`fixed bottom-20 md:bottom-6 right-6 ${colors[type] || colors.info} text-white px-4 py-3 rounded-lg shadow-xl z-50 flex items-center gap-3 animate-fade-in`}>
                    <i data-lucide={type === 'success' ? 'check-circle' : type === 'warning' ? 'alert-triangle' : 'info'} className="w-5 h-5"></i>
                    <span className="font-medium">{message}</span>
                    <button onClick={onClose} className="ml-2 hover:opacity-75"><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
            );
        };

                                            <div className="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-600 dark:text-slate-300">
                                                {student.sno}
                                            </div>
                                            <div>
                                                <p className="font-medium text-sm text-slate-900 dark:text-slate-200">{student.name}</p>

                                            {student.stats.percent}%
                                        </span>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 7. Mark Attendance Page
        const MarkAttendancePage = ({ students, showToast, refreshData }) => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [year, setYear] = useState(ACADEMIC_YEARS[0]);
            const [semester, setSemester] = useState(SEMESTERS[4]);

            const [showConfirm, setShowConfirm] = useState(false);
            const [isDuplicate, setIsDuplicate] = useState(false);

            useEffect(() => {
                const draft = StorageService.getDraft();
                if (draft) {
                    setDate(draft.date);
                    setYear(draft.academicYear);
                    setSemester(draft.semester);
                    setPeriodId(draft.periodId);
                    setRecords(draft.records);
                    showToast("Restored unsaved draft.", "info");
                }
            }, []);

            useEffect(() => {
                if (date && periodId) {
                    const dup = StorageService.findDuplicateSession(date, periodId);
                    setIsDuplicate(!!dup);
                    if (dup && Object.keys(records).length === 0) {
                        setRecords(dup.records);
                    }
                }
            }, [date, periodId]);

            useEffect(() => {
                const timer = setTimeout(() => {
                    if (Object.keys(records).length > 0) {
                        StorageService.saveDraft({ date, periodId, academicYear: year, semester, records });
                    }
                }, 1500);
                return () => clearTimeout(timer);
            }, [records, date, periodId, year, semester]);

            const markAll = (status) => {
                const newRecs = { ...records };
                students.forEach(s => newRecs[s.id] = status);
                setRecords(newRecs);
            };

            const markRemaining = (status) => {
                const newRecs = { ...records };
                students.forEach(s => { if (!newRecs[s.id]) newRecs[s.id] = status; });
                setRecords(newRecs);
            };

            const toggleStatus = (studentId, status) => {
                setRecords(prev => {
                    const next = { ...prev };
                    if (next[studentId] === status) delete next[studentId];
                    else next[studentId] = status;
                    return next;
                });
            };

            const submitAttendance = () => {
                const unmarked = students.filter(s => !records[s.id]).length;
                if (unmarked > 0 && !confirm(`${unmarked} students are unmarked. Proceed anyway?`)) return;
                
                const dup = StorageService.findDuplicateSession(date, periodId);
                const sessionData = {
                    id: dup ? dup.id : null,
                    date, periodId, academicYear: year, semester, records
                };
                
                StorageService.saveHistorySession(sessionData);
                refreshData();
                showToast("Attendance saved successfully!", "success");
                setRecords({});
                setShowConfirm(false);
            };

            const filteredStudents = students.filter(s => s.name.toLowerCase().includes(search.toLowerCase()) || s.regNo.includes(search));
            
            let p=0, od=0, a=0, un=0;
            students.forEach(s => {
                if (records[s.id]==='P') p++;
                else if (records[s.id]==='OD') od++;
                else if (records[s.id]==='A') a++;
                else un++;
            });

            return (

                                <i data-lucide="alert-triangle" className="w-4 h-4"></i>

                            </div>

                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">Period</label>
                                <select value={periodId} onChange={e=>setPeriodId(Number(e.target.value))} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                    {PERIODS.map(p => <option key={p.id} value={p.id}>{p.name} ({p.time})</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">Year</label>
                                <select value={year} onChange={e=>setYear(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                    {ACADEMIC_YEARS.map(y => <option key={y} value={y}>{y}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">Semester</label>
                                <select value={semester} onChange={e=>setSemester(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                    {SEMESTERS.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
                        <div className="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-center"><p className="text-xs font-bold text-slate-500">Total</p><p className="text-xl font-black dark:text-white">{students.length}</p></div>
                        <div className="bg-green-50 dark:bg-green-900/20 p-3 rounded-xl text-center"><p className="text-xs font-bold text-green-600">Present</p><p className="text-xl font-black text-green-700 dark:text-green-400">{p}</p></div>
                        <div className="bg-cyan-50 dark:bg-cyan-900/20 p-3 rounded-xl text-center"><p className="text-xs font-bold text-cyan-600">OD</p><p className="text-xl font-black text-cyan-700 dark:text-cyan-400">{od}</p></div>
                        <div className="bg-rose-50 dark:bg-rose-900/20 p-3 rounded-xl text-center"><p className="text-xs font-bold text-rose-600">Absent</p><p className="text-xl font-black text-rose-700 dark:text-rose-400">{a}</p></div>
                        <div className="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-center"><p className="text-xs font-bold text-slate-500">Unmarked</p><p className="text-xl font-black dark:text-white">{un}</p></div>
                        <div className="bg-indigo-50 dark:bg-indigo-900/20 p-3 rounded-xl text-center"><p className="text-xs font-bold text-indigo-600">%</p><p className="text-xl font-black text-indigo-700 dark:text-indigo-400">{perc}%</p></div>
                    </div>

                    <div className="glass-card p-5">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                            <div className="relative w-full md:w-64">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                <input type="text" placeholder="Search student..." value={search} onChange={e=>setSearch(e.target.value)}
                                    className="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                            <div className="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">

                                <button onClick={()=>markRemaining('P')} className="whitespace-nowrap px-4 py-2 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 dark:bg-indigo-900/30 dark:text-indigo-400 rounded-lg text-sm font-bold transition-colors">Remaining Present</button>
                                <button onClick={()=>setRecords({})} className="whitespace-nowrap px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 rounded-lg text-sm font-bold transition-colors">Clear</button>
                            </div>
                        </div>

                        {/* Desktop Table */}
                        <div className="hidden md:block overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider border-y border-slate-200 dark:border-slate-700">

                                            <td className="py-3 px-4 text-sm font-bold text-slate-800 dark:text-slate-100">{student.name}</td>
                                            <td className="py-3 px-4">
                                                <span className={`text-xs font-bold px-2 py-1 rounded-md ${
                                                    student.stats.health === 'critical' ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/30' : student.stats.health === 'warning' ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30' : 'bg-green-100 text-green-700 dark:bg-green-900/30'
                                                }`}>{student.stats.percent}%</span>
                                            </td>
                                            <td className="py-3 px-4 flex justify-center gap-2">
                                                <button onClick={()=>toggleStatus(student.id, 'P')} className={`w-10 h-10 rounded-lg font-bold text-lg transition-all ${records[student.id]==='P' ? 'bg-green-600 text-white shadow-lg scale-110' : 'bg-green-50 text-green-700 hover:bg-green-100 dark:bg-green-900/20 dark:text-green-500'}`}>P</button>
                                                <button onClick={()=>toggleStatus(student.id, 'OD')} className={`w-14 h-10 rounded-lg font-bold text-base transition-all ${records[student.id]==='OD' ? 'bg-cyan-600 text-white shadow-lg scale-110' : 'bg-cyan-50 text-cyan-700 hover:bg-cyan-100 dark:bg-cyan-900/20 dark:text-cyan-500'}`}>OD</button>
                                                <button onClick={()=>toggleStatus(student.id, 'A')} className={`w-10 h-10 rounded-lg font-bold text-lg transition-all ${records[student.id]==='A' ? 'bg-rose-600 text-white shadow-lg scale-110' : 'bg-rose-50 text-rose-700 hover:bg-rose-100 dark:bg-rose-900/20 dark:text-rose-500'}`}>A</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {/* Mobile Cards */}
                        <div className="md:hidden space-y-3">
                            {filteredStudents.map(student => (
                                <div key={student.id} className="p-3 border border-slate-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800 shadow-sm">
                                    <div className="flex justify-between items-start mb-3">
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs font-bold text-slate-400">{student.sno}.</span>
                                                <h4 className="font-bold text-slate-800 dark:text-slate-100">{student.name}</h4>
                                            </div>
                                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{student.regNo}</p>
                                        </div>
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                                            student.stats.health === 'critical' ? 'bg-rose-100 text-rose-700' : student.stats.health === 'warning' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'
                                        }`}>{student.stats.percent}%</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>toggleStatus(student.id, 'P')} className={`flex-1 py-2 rounded-lg font-bold transition-all ${records[student.id]==='P' ? 'bg-green-600 text-white shadow-md' : 'bg-green-50 text-green-700 dark:bg-green-900/20 dark:text-green-500 border border-green-200 dark:border-green-800'}`}>Present</button>
                                        <button onClick={()=>toggleStatus(student.id, 'OD')} className={`flex-1 py-2 rounded-lg font-bold transition-all ${records[student.id]==='OD' ? 'bg-cyan-600 text-white shadow-md' : 'bg-cyan-50 text-cyan-700 dark:bg-cyan-900/20 dark:text-cyan-500 border border-cyan-200 dark:border-cyan-800'}`}>OD</button>
                                        <button onClick={()=>toggleStatus(student.id, 'A')} className={`flex-1 py-2 rounded-lg font-bold transition-all ${records[student.id]==='A' ? 'bg-rose-600 text-white shadow-md' : 'bg-rose-50 text-rose-700 dark:bg-rose-900/20 dark:text-rose-500 border border-rose-200 dark:border-rose-800'}`}>Absent</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Sticky Bottom Bar */}
                    <div className="fixed bottom-0 md:bottom-0 left-0 md:left-64 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20 flex justify-between items-center mb-16 md:mb-0">
                        <div className="hidden sm:block">
                            <p className="text-sm font-bold dark:text-white">Session Progress</p>
                            <p className="text-xs text-slate-500">{Object.keys(records).length} / {students.length} Marked</p>
                        </div>
                        <button onClick={()=>setShowConfirm(true)} disabled={Object.keys(records).length===0} className="w-full sm:w-auto bg-indigo-600 disabled:bg-slate-400 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-bold transition-colors shadow-lg flex items-center justify-center gap-2">
                            <i data-lucide="save" className="w-5 h-5"></i> Submit Attendance
                        </button>
                    </div>

                    {/* Confirm Modal */}
                    {showConfirm && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl animate-fade-in">
                                <div className="bg-indigo-600 p-4 text-white">
                                    <h3 className="font-bold text-lg flex items-center gap-2"><i data-lucide="check-circle" className="w-5 h-5"></i> Confirm Submission</h3>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div className="bg-slate-50 dark:bg-slate-800 p-3 rounded-lg text-sm space-y-1 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700">
                                        <p><span className="font-bold text-slate-500">Date:</span> {date}</p>
                                        <p><span className="font-bold text-slate-500">Period:</span> Period {periodId} ({PERIODS.find(p=>p.id===periodId)?.time || ''})</p>
                                    </div>
                                    <div className="grid grid-cols-3 gap-3 text-center">
                                        <div className="p-2 bg-green-50 dark:bg-green-900/20 rounded-lg"><p className="text-xl font-bold text-green-700 dark:text-green-500">{p}</p><p className="text-xs font-medium text-green-600">Present</p></div>
                                        <div className="p-2 bg-cyan-50 dark:bg-cyan-900/20 rounded-lg"><p className="text-xl font-bold text-cyan-700 dark:text-cyan-500">{od}</p><p className="text-xs font-medium text-cyan-600 font-bold">OD</p></div>
                                        <div className="p-2 bg-rose-50 dark:bg-rose-900/20 rounded-lg"><p className="text-xl font-bold text-rose-700 dark:text-rose-500">{a}</p><p className="text-xs font-medium text-rose-600">Absent</p></div>
                                    </div>
                                    {un > 0 && <p className="text-sm text-rose-500 font-bold text-center"><i data-lucide="alert-circle" className="w-4 h-4 inline mr-1"></i> {un} students are unmarked!</p>}
                                </div>
                                <div className="p-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3 bg-slate-50 dark:bg-slate-900">
                                    <button onClick={()=>setShowConfirm(false)} className="px-5 py-2 rounded-lg font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800">Cancel</button>
                                    <button onClick={submitAttendance} className="px-5 py-2 rounded-lg font-bold bg-indigo-600 text-white hover:bg-indigo-700 shadow-md">Confirm & Save</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 8. Attendance History Page
        const AttendanceHistoryPage = ({ history, students, setActiveTab, refreshData, showToast, user }) => {
            const [search, setSearch] = useState('');

            const sorted = [...history].sort((a,b) => b.timestamp - a.timestamp);
            const filtered = sorted.filter(h => 
                h.date.includes(search) || h.id.includes(search)
            );

            const handleDelete = (id) => {
                if(confirm("Are you sure you want to delete this session? This cannot be undone.")) {
                    StorageService.deleteHistorySession(id);
                    refreshData();
                    showToast("Session deleted", "success");
                }
            };

            const handleEdit = (session) => {
                StorageService.saveDraft(session);
                setActiveTab('mark-attendance');
            };

            const doPDF = (session) => {
                ExportService.exportPDF(session, students);
            };

            const doExcel = (session) => {
                ExportService.exportExcel(session, students);
            };

            return (
                <div className="space-y-6 animate-fade-in pb-20">
                    <div className="glass-card p-5 flex flex-col md:flex-row gap-4 justify-between items-center">
                        <h2 className="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <i data-lucide="calendar" className="w-5 h-5 text-indigo-500"></i> History
                        </h2>
                        <div className="flex gap-3 w-full md:w-auto">
                            <input type="date" value={search} onChange={e=>setSearch(e.target.value)} className="px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none focus:ring-2 focus:ring-indigo-500" />
                        </div>
                    </div>

                    <div className="space-y-4">
                        {filtered.map(session => {
                            let p=0, od=0, a=0;
                            Object.values(session.records).forEach(v => {
                                if(v==='P') p++;
                                if(v==='OD') od++;
                                if(v==='A') a++;
                            });
                            const total = p+od+a;
                            const perc = total > 0 ? Math.round(((p+od)/total)*100) : 0;
                            const periodObj = PERIODS.find(p => p.id == session.periodId);

                            return (
                                <div key={session.id} className="glass-card p-5 border-l-4 border-indigo-500 hover:border-indigo-600 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                                    <div className="flex gap-4 items-center">
                                        <div className="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-center min-w-[70px]">
                                            <p className="text-xs font-bold text-slate-500 uppercase">{new Date(session.date).toLocaleDateString('en-US',{weekday:'short'})}</p>
                                            <p className="text-lg font-black text-slate-800 dark:text-white">{session.date.split('-')[2]}</p>
                                            <p className="text-[10px] text-slate-500">{session.date.split('-')[1]}/{session.date.split('-')[0]}</p>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-lg text-slate-800 dark:text-slate-100">{periodObj ? periodObj.name : `Period ${session.periodId}`} Session</h4>

                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center gap-6 w-full lg:w-auto">

        // 9. Student Database Page
        const StudentDatabasePage = ({ students, openStudentModal }) => {

        // 10. Student Modal (Detailed Profile)
        const StudentModal = ({ student, history, onClose }) => {

            const studHistory = [];
            
            history.forEach(session => {

                                </div>
                                <div className="bg-cyan-50 dark:bg-cyan-900/20 border border-cyan-100 dark:border-cyan-800 rounded-xl p-4 text-center">

                                    <p className="text-3xl font-black text-rose-700 dark:text-rose-500">{student.stats.absent}</p>

                            {/* Recent Activity */}

                                <div className="space-y-3">
                                    {studHistory.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0, 5).map((log, i) => {

                                                </div>
                                                <span className={`px-3 py-1 rounded-md text-xs font-bold ${log.status==='P'?'bg-green-100 text-green-700':log.status==='OD'?'bg-cyan-100 text-cyan-700':'bg-rose-100 text-rose-700'}`}>
                                                    {log.status === 'P' ? 'Present' : log.status === 'OD' ? 'On Duty' : 'Absent'}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        // 11. Low Attendance Alerts Page
        const LowAttendancePage = ({ students, openStudentModal, showToast }) => {
            const lowAttStudents = students.filter(s => s.stats.percent < 75);

            const handleExport = () => {
                let csvContent = "data:text/csv;charset=utf-8,";

                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "low_attendance_students_cse_b.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Low attendance list exported successfully!", "success");
            };

            return (
                <div className="space-y-6 animate-fade-in pb-20">
                    <div className="glass-card p-6 border-l-4 border-rose-500 flex flex-col md:flex-row justify-between items-center gap-4">

                            <i data-lucide="download" className="w-4 h-4"></i> Export Flagged List
                        </button>

                                    <span className="text-xs font-mono font-bold text-slate-400">#{student.sno} • {student.regNo}</span>
                                    <span className={`text-xs font-black px-2 py-0.5 rounded-full ${student.stats.percent < 60 ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400' : 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'}`}>

                            </div>
                        )}

        };

        // 12. Monthly Reports Page
        const ReportsPage = ({ students, history, openStudentModal, showToast }) => {
            const [selectedYear, setSelectedYear] = useState('2026');
            const [selectedMonth, setSelectedMonth] = useState('08');
            const [search, setSearch] = useState('');

            const years = ["2026", "2025", "2024"];
            const months = [
                { id: '01', name: 'January' }, { id: '02', name: 'February' }, { id: '03', name: 'March' },
                { id: '04', name: 'April' }, { id: '05', name: 'May' }, { id: '06', name: 'June' },
                { id: '07', name: 'July' }, { id: '08', name: 'August' }, { id: '09', name: 'September' },
                { id: '10', name: 'October' }, { id: '11', name: 'November' }, { id: '12', name: 'December' }
            ];

            const filteredSessions = useMemo(() => {
                return history.filter(session => {
                    const sessYear = session.date.split('-')[0];
                    const sessMonth = session.date.split('-')[1];
                    return sessYear === selectedYear && sessMonth === selectedMonth;
                });
            }, [history, selectedYear, selectedMonth]);

            const reportRows = useMemo(() => {
                return students.map(student => {
                    let present = 0, od = 0, absent = 0, total = 0;
                    filteredSessions.forEach(session => {
                        if (session.records[student.id]) {
                            total++;
                            if (session.records[student.id] === 'P') present++;
                            if (session.records[student.id] === 'OD') od++;
                            if (session.records[student.id] === 'A') absent++;
                        }
                    });
                    const percent = total > 0 ? Math.round(((present + od) / total) * 100) : 100;
                    return {
                        ...student,
                        total, present, od, absent, percent
                    };
                }).filter(s => s.name.toLowerCase().includes(search.toLowerCase()) || s.regNo.includes(search));
            }, [students, filteredSessions, search]);

            const dailyTrends = useMemo(() => {
                const datesMap = {};
                filteredSessions.forEach(session => {
                    if (!datesMap[session.date]) {
                        datesMap[session.date] = { present: 0, total: 0 };
                    }
                    Object.values(session.records).forEach(status => {
                        datesMap[session.date].total++;
                        if (status === 'P' || status === 'OD') datesMap[session.date].present++;
                    });
                });
                
                return Object.keys(datesMap).sort().map(d => {
                    const entry = datesMap[d];
                    const pct = entry.total > 0 ? Math.round((entry.present / entry.total) * 100) : 0;
                    return { date: d.split('-')[2], percent: pct };
                });
            }, [filteredSessions]);

            const handleExport = () => {
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += `PAAVAI ENGINEERING COLLEGE - CSE B\n`;
                const monthName = months.find(m => m.id === selectedMonth)?.name;
                csvContent += `Monthly Attendance Report: ${monthName} ${selectedYear}\n\n`;
                csvContent += "S.No,Registration Number,Student Name,Total Classes,Present,OD,Absent,Attendance Percentage\n";
                
                reportRows.forEach(r => {
                    csvContent += `${r.sno},"${r.regNo}","${r.name}",${r.total},${r.present},${r.od},${r.absent},${r.percent}%\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `monthly_report_${monthName}_${selectedYear}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Report exported successfully!", "success");
            };

            return (
                <div className="space-y-6 animate-fade-in pb-20">
                    <div className="glass-card p-6 border-l-4 border-indigo-600 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                <i data-lucide="bar-chart-3" className="w-5 h-5 text-indigo-500"></i> Monthly Reports & Charts
                            </h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">
                                Generate month-wise academic attendance lists and daily percentage trends.
                            </p>
                        </div>
                        <button onClick={handleExport} disabled={reportRows.length === 0}
                            className="bg-indigo-600 disabled:bg-slate-400 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-indigo-700 transition-colors flex items-center gap-2">
                            <i data-lucide="download" className="w-4 h-4"></i> Export Monthly Report
                        </button>
                    </div>

                    <div className="glass-card p-5 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label className="block text-xs font-bold text-slate-500 mb-1">Year</label>
                            <select value={selectedYear} onChange={e=>setSelectedYear(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm dark:text-white outline-none focus:ring-2 focus:ring-indigo-500">
                                {years.map(y => <option key={y} value={y}>{y}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-500 mb-1">Month</label>
                            <select value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm dark:text-white outline-none focus:ring-2 focus:ring-indigo-500">
                                {months.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-500 mb-1">Search Student</label>
                            <input type="text" placeholder="Name or Reg No..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-sm dark:text-white outline-none focus:ring-2 focus:ring-indigo-500" />
                        </div>
                    </div>

                    {dailyTrends.length > 0 ? (
                        <div className="glass-card p-6">
                            <h3 className="font-bold text-base mb-4 text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                <i data-lucide="trending-up" className="w-4 h-4 text-indigo-500"></i> Attendance Trend (Daily Avg %)
                            </h3>
                            <div className="h-48 w-full flex items-end justify-between gap-2 pt-6 px-4 border-b border-l border-slate-200 dark:border-slate-700 relative">
                                {dailyTrends.map((trend, i) => (
                                    <div key={i} className="flex-1 flex flex-col items-center group relative h-full justify-end">
                                        <div style={{ height: `${trend.percent}%` }} className="w-full bg-gradient-to-t from-indigo-600 to-indigo-400 hover:from-indigo-500 hover:to-indigo-300 rounded-t-sm transition-all duration-500 relative">
                                            <span className="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white text-[10px] font-bold px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity z-10 whitespace-nowrap shadow-md">
                                                {trend.percent}%
                                            </span>
                                        </div>
                                        <span className="text-[10px] font-bold text-slate-400 mt-2 font-mono">{trend.date}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="glass-card p-10 text-center text-slate-500">
                            <i data-lucide="bar-chart" className="w-12 h-12 mx-auto mb-3 opacity-30"></i>
                            <p className="font-medium text-sm">No sessions marked for this combination of filters.</p>
                        </div>
                    )}

                    <div className="glass-card overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider border-b border-slate-200 dark:border-slate-700">
                                        <th className="py-4 px-4 w-16">S.No</th>
                                        <th className="py-4 px-4">Registration No</th>
                                        <th className="py-4 px-4">Student Name</th>
                                        <th className="py-4 px-4 text-center">Total Classes</th>
                                        <th className="py-4 px-4 text-center">Present</th>

                StorageService.init();

                        const payload = {
                            students: JSON.parse(localStorage.getItem('paavai_students') || '[]'),
                            history: JSON.parse(localStorage.getItem('paavai_history') || '[]'),
                            staffUsers: JSON.parse(localStorage.getItem('paavai_staff_users') || '[]'),
                            passcode: localStorage.getItem('paavai_staff_passcode') || 'paavaistaff'
                        };
                        await fetch('/api/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        console.log("Local database uploaded to server.");
                    } catch (e) {
                        console.warn("Failed to upload local database to server:", e);
                    }
                };
                
                const loadServerData = async () => {
                    try {
                        const res = await fetch('/api/data');
                        if (res.ok) {
                            const serverData = await res.json();
                            if (serverData && serverData.students && serverData.students.length > 0) {
                                if (serverData.students) localStorage.setItem('paavai_students', JSON.stringify(serverData.students));
                                if (serverData.history) localStorage.setItem('paavai_history', JSON.stringify(serverData.history));
                                if (serverData.staffUsers) localStorage.setItem('paavai_staff_users', JSON.stringify(serverData.staffUsers));
                                if (serverData.passcode) localStorage.setItem('paavai_staff_passcode', serverData.passcode);
                                console.log("Successfully fetched and synchronized database from python server.");
                            } else {
                                console.log("Server database is empty. Uploading local database...");
                                await saveLocalToServer();
                            }
                        }
                    } catch (err) {
                        console.warn("Could not connect to python server backend. Running in local browser-only offline mode:", err);
                    }
                };
                
                loadServerData().finally(() => {
                    refreshData();
                    const loggedIn = StorageService.getUser();
                    if(loggedIn) setUser(loggedIn);
                    
                    // Allow sync effect to trigger after initial loads complete
                    setTimeout(() => {
                        isInitialMount.current = false;
                    }, 500);
                });
                
                // Set initial dark mode
                if (darkMode) document.documentElement.classList.add('dark');
            }, []);

            // Watch state changes and sync to backend server database.json
            useEffect(() => {
                if (isInitialMount.current) return;
                
                const saveToServer = async () => {
                    try {
                        const payload = {
                            students: students,
                            history: history,
                            staffUsers: staffUsers,
                            passcode: localStorage.getItem('paavai_staff_passcode') || 'paavaistaff'
                        };
                        
                        await fetch('/api/save', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                        console.log("Database successfully synchronized to central server.");
                    } catch (err) {
                        console.warn("Server sync save failed (offline mode):", err);
                    }
                };
                
                saveToServer();
            }, [students, history, staffUsers]);

            // Icons
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            // Toggle Dark Mode
            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            const refreshData = useCallback(() => {
                setStudents(StorageService.getStudents());
                setHistory(StorageService.getHistory());
                setDraft(StorageService.getDraft());
                setStaffUsers(StorageService.getStaffUsers());
            }, []);

            const handleLogin = (u) => {
                StorageService.setUser(u);
                setUser(u);
                showToast(`Welcome back, ${u.name}`, "success");
            };

            const handleUpdateUser = (u) => {
                StorageService.setUser(u);
                setUser(u);
            };
            
            const handleLogout = () => {
                StorageService.logout();
                setUser(null);
                setToast({ message: 'Logged out successfully.', type: 'info' });
            };

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            const handleAddStaff = (newStaff) => {
                if (staffUsers.some(u => u.email.toLowerCase() === newStaff.email.toLowerCase())) {
                    showToast("Staff user with this username/email already exists.", "error");
                    return false;
                }
                const updated = [...staffUsers, newStaff];
                setStaffUsers(updated);
                StorageService.saveStaffUsers(updated);
                showToast(`Staff member "${newStaff.name}" added successfully!`, "success");
                return true;
            };

            if (!user) {
                return <LoginPage onLogin={handleLogin} students={students} />;
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
                    <Header user={user} darkMode={darkMode} setDarkMode={setDarkMode} toggleSidebar={()=>setSidebarShow(!sidebarShow)} hasDraft={!!draft} onOpenAddStaffModal={() => setIsAddStaffOpen(true)} />
                    
                    <div className="flex flex-1 overflow-hidden">
                        <Sidebar user={user} activeTab={activeTab} setActiveTab={setActiveTab} onLogout={handleLogout} isMobile={window.innerWidth < 768} show={sidebarShow} closeSidebar={()=>setSidebarShow(false)} />
                        
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            <div className="max-w-6xl mx-auto">
                                {activeTab === 'dashboard' && <DashboardPage students={students} history={history} setActiveTab={setActiveTab} user={user} />}
                                {activeTab === 'mark-attendance' && user.role !== 'student' && <MarkAttendancePage students={students} showToast={showToast} refreshData={refreshData} />}
                                {activeTab === 'history' && <AttendanceHistoryPage history={history} students={students} setActiveTab={setActiveTab} refreshData={refreshData} showToast={showToast} user={user} />}
                                {activeTab === 'students' && <StudentDatabasePage students={students} openStudentModal={setSelectedStudent} />}
                                {activeTab === 'low-attendance' && <LowAttendancePage students={students} openStudentModal={setSelectedStudent} showToast={showToast} />}
                                {activeTab === 'reports' && <ReportsPage students={students} history={history} openStudentModal={setSelectedStudent} showToast={showToast} />}
                                {activeTab === 'settings' && user.role !== 'student' && <SettingsPage user={user} onUpdateUser={handleUpdateUser} showToast={showToast} staffUsers={staffUsers} setStaffUsers={setStaffUsers} />}
                            </div>

                            <footer className="w-full text-center py-4 text-xs text-slate-400 dark:text-slate-500 border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/30 mt-8 rounded-xl">
                                <p className="font-medium tracking-wide">
                                    Student Attendance Management System | Paavai Engineering College
                                </p>
                                <p className="mt-1 text-indigo-600 dark:text-indigo-400 font-bold tracking-wider flex items-center justify-center gap-1">
                                    <i data-lucide="code" className="w-3.5 h-3.5 text-indigo-500"></i> Website built by HARIHARAN R
                                </p>
                            </footer>
                        </main>
                    </div>

                    <MobileNav user={user} activeTab={activeTab} setActiveTab={setActiveTab} toggleSidebar={()=>setSidebarShow(true)} />
                    <Toast message={toast.message} type={toast.type} onClose={()=>setToast({message:''})} />
                    
                    <StudentModal student={selectedStudent} history={history} onClose={()=>setSelectedStudent(null)} />
                    <AddStaffModal isOpen={isAddStaffOpen} onClose={() => setIsAddStaffOpen(false)} onAddStaff={handleAddStaff} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
